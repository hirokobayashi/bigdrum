# コース選択 (start サービス) の選択肢は BD-STX120H の COURSEINF カタログ
# (version 01003C1420220929) から生成したもので、洗濯=11xx/21xx・洗乾=12xx/22xx・
# 乾燥=13xx・その他(槽洗浄/アイロン等)=14xx/15xx の順。
# 【fork 変更】bd-stx120h ブランチ: 実機 (BD-STX120H / 01003C14) のカタログから
# 再生成した版。upstream (BD-STX110G 版・66コース) とは機種差がある。
# 再生成は tools/regen_services.py + tools/courseinf_01003C14.json を使用。
# UI の select はこのリストに限られるが、YAML 呼び出しは任意の 4桁 hex
# course_no を渡せる (カタログに無ければエラー)。カタログ更新時はこのリストも更新する。
# delay_minutes = 開始までの分数 (10進・1-1440=24時間、コースごとに最低リードタイムあり)。
# 予約の低レベル指定 marker (4桁 hex) や entry_id は UI に出さず YAML 専用にする。
